server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Content-Security-Policy baseline (PSH1-E1/E2, FE-P4). Compensating control for the
    # SPA's localStorage token storage — see docs/SECURITY.md.
    #   script-src 'self'      — built bundle is a single external ES module; no inline <script>.
    #   style-src  'unsafe-inline' — index.html ships the inline preloader <style>/@font-face,
    #                                and React/runtime libraries inject style attributes.
    #   connect-src https: wss: — REST API (env-configured origin) + SignalR websockets.
    #                             Tighten to the concrete API host per deployment.
    #   frame-ancestors 'self' — clickjacking guard (mirrors X-Frame-Options for modern browsers).
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; font-src 'self' data:; connect-src 'self' https: wss:; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self'" always;

    # SPA routing - all routes should serve index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Cache static assets
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Health check endpoint
    location /health {
        access_log off;
        return 200 "healthy\n";
        add_header Content-Type text/plain;
    }
}
